<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="formularz" onSubmit="return false";>
        <i> Podaj pierwszą liczbę</i>
            <input type="number" name="liczba1" id="liczba1"><br>
        <i> Podaj drugą liczbę </i>
            <input type="number" name="liczba2" id="liczba2"><br>
        
            <button Onclick="fun(1)";>Dodawanie</button>
            <button Onclick="fun(2)";>Odejmowanie</button>
            <button Onclick="fun(3)";>Mnozenie</button> 
            <button Onclick="fun(4)";>Dzielenie</button>
            <br>
            <output id="wynik"></output>
    </form>

    <script>
        function fun(operacja){
            let liczba1=parseInt(document.querySelector("#liczba1").value);
             let liczba2=parseInt(document.querySelector("#liczba2").value);
             let wynik;
             if(isNaN(liczba1) || isNaN(liczba2)) {
                wynik="Prosze uzupełnić obie liczby.";
             } else { 
                switch(operacja){
                    case 1: wynik=liczba1+liczba2; break;
                    case 2: wynik=liczba1-liczba2; break;
                    case 3: wynik=liczba1*liczba2; break;
                    case 4: 
                        if(liczba2==0) {wynik="Nie dzielimy przez 0"; } else { wynik=liczba1/liczba2; break;}
                }
             }
                document.querySelector("#wynik").innerHTML=wynik;
        }
    </script>
    
</body>
</html>
